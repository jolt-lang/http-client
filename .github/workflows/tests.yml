name: tests
on: [push, pull_request]
# One pinned jolt, not whatever the latest release happens to be. The supported
# floor is 0.8.0, which deps.edn declares as :jolt/min-version: jolt.ffi/write
# takes the value before the offset from 0.8.0 on, and the two spellings are
# both integers, so on 0.7.x the zlib path wrote to the wrong place and the
# compressed-body tests crashed (then the server they left behind held port
# 18091 and every later suite died on bind). 0.7.19 was the floor before that:
# jolt.http.net reads errno through jolt.io-poller, and 0.7.19 is where jolt's
# own java.io byte streams answer the full surface (readNBytes/transferTo/mark).
#
# Raise the pin as new jolt releases land.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JOLT_VERSION: '0.8.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libssl3
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum. Resolving the asset by hand left this workflow
          # chmod'ing a $HOME/.jolt/joltc that no release ships any more.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
