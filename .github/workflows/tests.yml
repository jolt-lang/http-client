name: tests
on: [push, pull_request]
# One pinned jolt, not whatever the latest release happens to be. The supported
# floor is 0.8.1, which deps.edn declares as :jolt/min-version: jolt.ffi/write
# takes the value before the offset from 0.8.0 on, and the two spellings are
# both integers, so on 0.7.x the zlib path wrote to the wrong place and the
# compressed-body tests crashed (then the server they left behind held port
# 18091 and every later suite died on bind). 0.7.19 was the floor before that:
# jolt.http.net reads errno through jolt.io-poller, and 0.7.19 is where jolt's
# own java.io byte streams answer the full surface (readNBytes/transferTo/mark).
# 0.8.1 raised it once more: that is where java.util.concurrent's executor
# interfaces entered jolt's class graph, without which babashka.http-client's
# ->Executor builds a pool that answers false to (instance? ThreadPoolExecutor).
#
# The pin is the DECLARED FLOOR, not the newest release, so CI tests the oldest
# jolt deps.edn claims to support. Raise both together.
#
# 0.8.8 runs alongside it because one behaviour is version-gated rather than
# absent below the floor: `:as :stream` hands back a LIVE body, and that stream
# is a reify java.io.InputStream, which needs the abstract-class method
# inheritance jolt gained in 0.8.8. Below it the transport probes for one, does
# not find it, and keeps the buffered path — supported, and what the floor leg
# tests. Testing only the floor would leave the live path uncovered; testing
# only 0.8.8 would let the fallback rot. Both legs run the same suites, and the
# streaming cases assert whichever contract is in force.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jolt: ['0.8.1', '0.8.8']
    name: test (jolt ${{ matrix.jolt }})
    env:
      JOLT_VERSION: ${{ matrix.jolt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libssl3
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum. Resolving the asset by hand left this workflow
          # chmod'ing a $HOME/.jolt/joltc that no release ships any more.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      # Each suite is its own process on purpose: they bind their own ports and
      # stand up their own servers, and a suite that leaves a listener behind
      # takes the next one down with it. :timeouttest is deliberately absent —
      # one of its cases fetches https://example.com, so it needs egress.
      - name: clj-http-lite suites
        run: JOLT_PWD="$PWD" jolt -M:test
      - name: babashka.http-client compatibility
        run: JOLT_PWD="$PWD" jolt -M:bhctest
      - name: WebSocket
        run: JOLT_PWD="$PWD" jolt -M:wstest
      - name: TLS
        run: JOLT_PWD="$PWD" jolt -M:tlstest
      - name: zlib
        run: JOLT_PWD="$PWD" jolt -M:zlibtest
