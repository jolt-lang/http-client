name: tests
on: [push, pull_request]
# CI runs against jolt's nightly build (release tag vnightly, the rolling build
# of jolt's main), so a jolt change that breaks this library shows up the day it
# lands rather than at the next release, and against the declared floor,
# :jolt/min-version 0.8.25 (Files/probeContentType as the JDK answers it, and
# 0.8.24's BufferedInputStream mark/reset fixed). Raising the floor is a
# deps.edn change; move the matrix entry with it. Earlier floors, for the
# record: 0.8.16 (java.util.concurrent.CompletableFuture entered the runtime
# and this library stopped claiming it), 0.8.9 (java.util.zip entered the
# runtime, on the zlib every jolt binary links, and this library stopped
# shipping gzip/deflate shims of its own over the system libz), 0.8.1 (java.util.concurrent's executor interfaces,
# which babashka.http-client's ->Executor type-checks), 0.8.0 (jolt.ffi/write's
# argument order), 0.7.19 (jolt's own java.io byte streams answering the full
# surface). The `:as :stream` live-body path needs 0.8.8's abstract-class method
# inheritance, which is below the floor.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jolt: ['nightly', '0.8.25']
    name: test (jolt ${{ matrix.jolt }})
    env:
      JOLT_VERSION: ${{ matrix.jolt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libssl3
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum. Resolving the asset by hand left this workflow
          # chmod'ing a $HOME/.jolt/joltc that no release ships any more.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      # Each suite is its own process on purpose: they bind their own ports and
      # stand up their own servers, and a suite that leaves a listener behind
      # takes the next one down with it. :timeouttest is deliberately absent —
      # one of its cases fetches https://example.com, so it needs egress.
      - name: clj-http-lite suites
        run: JOLT_PWD="$PWD" jolt -M:test
      - name: babashka.http-client compatibility
        run: JOLT_PWD="$PWD" jolt -M:bhctest
      - name: WebSocket
        run: JOLT_PWD="$PWD" jolt -M:wstest
      - name: TLS
        run: JOLT_PWD="$PWD" jolt -M:tlstest
